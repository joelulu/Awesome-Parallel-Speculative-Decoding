name: Build and deploy research atlas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Render missing real arXiv paper covers
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          bash scripts/generate-paper-covers.sh
      - name: Restore most recent public Star snapshots
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: .cache/stars.json
          key: stars-${{ github.run_id }}
          restore-keys: stars-
      - name: Restore snapshots into build data
        run: |
          if [ -f .cache/stars.json ]; then cp .cache/stars.json src/data/stars.json; fi
      - run: npm run sync:briefs
      - name: Refresh public GitHub Star counts
        if: github.event_name != 'pull_request'
        run: npm run update:stars
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm test
      - run: npm run build
      - name: Save Star snapshot for the next refresh
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p .cache
          cp src/data/stars.json .cache/stars.json
      - if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: .cache/stars.json
          key: stars-${{ github.run_id }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check deployed Pages in Chromium
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          PAGES_AUDIT_OUTPUT: ${{ github.workspace }}/.cache/pages-audit
        run: |
          mkdir -p "$RUNNER_TEMP/pages-audit"
          cp scripts/check-pages.mjs "$RUNNER_TEMP/pages-audit/check-pages.mjs"
          cd "$RUNNER_TEMP/pages-audit"
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node check-pages.mjs
      - name: Save Pages screenshots and check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-browser-audit
          path: .cache/pages-audit
          if-no-files-found: ignore
