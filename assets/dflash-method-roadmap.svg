<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1210" viewBox="0 0 1600 1210">
<defs>
<style>
.t{font:700 44px Arial,'Noto Sans SC',sans-serif;fill:#163a63}.s{font:400 21px Arial,'Noto Sans SC',sans-serif;fill:#506b86}.b{font:700 22px Arial,'Noto Sans SC',sans-serif;fill:#17324d}.l{font:700 16px Arial,'Noto Sans SC',sans-serif;fill:#17324d}.k{font:400 14px Arial,'Noto Sans SC',sans-serif;fill:#506070}.c{font:700 30px Arial,'Noto Sans SC',sans-serif;fill:#15365a}.sm{font:400 15px Arial,'Noto Sans SC',sans-serif;fill:#4d5f73}
</style>
</defs>
<rect width="1600" height="1210" fill="#fff"/>
<text x="800" y="58" text-anchor="middle" class="t">DFlash 后续方法脉络树</text>
<text x="800" y="92" text-anchor="middle" class="s">从 Block Diffusion Drafting 到跨轮次复用、树结构、因果补偿与高并发验证</text>

<!-- trunk -->
<path d="M170 1040 C190 830 215 600 250 410 C270 300 315 215 380 165" stroke="#8a6444" stroke-width="46" fill="none" stroke-linecap="round"/>
<path d="M170 1040 C150 1090 120 1140 85 1185 M170 1040 C195 1090 225 1145 265 1190" stroke="#8a6444" stroke-width="8" fill="none" stroke-linecap="round"/>
<ellipse cx="235" cy="360" rx="20" ry="11" fill="#5aa65a"/><ellipse cx="285" cy="290" rx="20" ry="11" fill="#5aa65a"/><ellipse cx="330" cy="230" rx="20" ry="11" fill="#5aa65a"/>
<rect x="55" y="585" width="310" height="190" rx="24" fill="#f8f2e8" stroke="#6d523a" stroke-width="3"/>
<text x="210" y="635" text-anchor="middle" class="c">DFlash (2026.02)</text>
<text x="82" y="675" class="sm">block diffusion drafter 并行生成整块 draft</text>
<text x="82" y="705" class="sm">核心优势：降低串行 drafting 开销</text>
<text x="82" y="735" class="sm">后续研究围绕 7 条主线展开</text>

<!-- 1 -->
<path d="M365 675 C430 675 430 145 500 145" stroke="#3d8edb" stroke-width="10" fill="none"/>
<rect x="500" y="113" width="385" height="64" rx="18" fill="#eaf4ff" stroke="#3d8edb" stroke-width="2"/><text x="524" y="153" class="b">1. 并行 drafter 本体增强</text>
<rect x="940" y="96" width="600" height="30" rx="12" fill="#f3f9ff" stroke="#9cc9ef"/><text x="958" y="116" class="l">DFlare</text><text x="1135" y="116" class="k">capacity scaling / layer-wise fusion</text>
<rect x="940" y="130" width="600" height="30" rx="12" fill="#f3f9ff" stroke="#9cc9ef"/><text x="958" y="150" class="l">HyperDFlash</text><text x="1135" y="150" class="k">hyper-connection adaptation</text>
<rect x="940" y="164" width="600" height="30" rx="12" fill="#f3f9ff" stroke="#9cc9ef"/><text x="958" y="184" class="l">DBloom</text><text x="1135" y="184" class="k">block size ceiling</text>

<!-- 2 -->
<path d="M365 675 C430 675 430 300 500 300" stroke="#f39b21" stroke-width="10" fill="none"/>
<rect x="500" y="268" width="385" height="64" rx="18" fill="#fff5e7" stroke="#f39b21" stroke-width="2"/><text x="524" y="308" class="b">2. 训练目标对齐</text>
<text x="950" y="235" class="l">D-PACE</text><text x="1135" y="235" class="k">position-aware loss</text>
<text x="950" y="269" class="l">Teaching L2R</text><text x="1135" y="269" class="k">acceptance-aware objective</text>
<text x="950" y="303" class="l">Spec-AUF</text><text x="1135" y="303" class="k">accept-until-fail</text>
<text x="950" y="337" class="l">Draft-OPD</text><text x="1135" y="337" class="k">on-policy distillation</text>
<text x="950" y="371" class="l">VAT</text><text x="1135" y="371" class="k">verification-aware training</text>

<!-- 3 -->
<path d="M365 675 C430 675 430 490 500 490" stroke="#3aa65a" stroke-width="10" fill="none"/>
<rect x="500" y="458" width="385" height="64" rx="18" fill="#eaf8ee" stroke="#3aa65a" stroke-width="2"/><text x="524" y="498" class="b">3. 块内因果性 / 相关性补偿</text>
<text x="950" y="410" class="l">Domino</text><text x="1135" y="410" class="k">causal correction</text>
<text x="950" y="444" class="l">DSpark</text><text x="1135" y="444" class="k">Markov head</text>
<text x="950" y="478" class="l">xPress</text><text x="1135" y="478" class="k">parallel refinement</text>
<text x="950" y="512" class="l">LiLiCorr</text><text x="1135" y="512" class="k">likelihood correlation</text>
<text x="950" y="546" class="l">DBLAST</text><text x="1135" y="546" class="k">dependent block drafting</text>
<text x="950" y="580" class="l">DFlash2</text><text x="1135" y="580" class="k">path selection + local conv</text>

<!-- 4 -->
<path d="M365 675 C430 675 430 700 500 700" stroke="#e64b55" stroke-width="10" fill="none"/>
<rect x="500" y="668" width="385" height="64" rx="18" fill="#fdecef" stroke="#e64b55" stroke-width="2"/><text x="524" y="708" class="b">4. 单路径 → 树结构 / 多路径</text>
<text x="950" y="620" class="l">DDTree</text><text x="1135" y="620" class="k">draft tree</text>
<text x="950" y="654" class="l">CaDDTree</text><text x="1135" y="654" class="k">cost-aware tree</text>
<text x="950" y="688" class="l">D²SD</text><text x="1135" y="688" class="k">dual diffusion drafting</text>
<text x="950" y="722" class="l">DominoTree</text><text x="1135" y="722" class="k">conditional tree</text>
<text x="950" y="756" class="l">JetSpec</text><text x="1135" y="756" class="k">parallel tree drafting</text>
<text x="950" y="790" class="l">DARTree</text><text x="1135" y="790" class="k">AR draft trees</text>

<!-- 5 ReTrace -->
<path d="M365 675 C430 675 430 865 500 865" stroke="#b56bc5" stroke-width="10" fill="none"/>
<rect x="500" y="833" width="385" height="64" rx="18" fill="#f7edf9" stroke="#b56bc5" stroke-width="2"/><text x="524" y="873" class="b">5. 跨轮次轨迹复用</text>
<rect x="940" y="846" width="600" height="38" rx="12" fill="#fbf5fc" stroke="#d8b2df"/><text x="958" y="870" class="l">ReTrace</text><text x="1135" y="870" class="k">rejected-trajectory conditioning / cross-round reuse</text>

<!-- 6 -->
<path d="M365 675 C430 675 430 980 500 980" stroke="#7c62d6" stroke-width="10" fill="none"/>
<rect x="500" y="948" width="385" height="64" rx="18" fill="#f1edff" stroke="#7c62d6" stroke-width="2"/><text x="524" y="988" class="b">6. 验证成本 / 高并发 / 自适应长度</text>
<text x="950" y="951" class="l">DSpark</text><text x="1135" y="951" class="k">adaptive verification</text>
<text x="950" y="985" class="l">D-CUT</text><text x="1135" y="985" class="k">verification pruning</text>
<text x="950" y="1019" class="l">AdaFlash</text><text x="1135" y="1019" class="k">adaptive draft length</text>

<!-- 7 -->
<path d="M365 675 C430 675 430 1100 500 1100" stroke="#24a7ad" stroke-width="10" fill="none"/>
<rect x="500" y="1068" width="385" height="64" rx="18" fill="#e9f8f8" stroke="#24a7ad" stroke-width="2"/><text x="524" y="1108" class="b">7. 多模态扩展</text>
<text x="950" y="1105" class="l">GLANCE</text><text x="1135" y="1105" class="k">VLM block drafting</text>

<rect x="430" y="1165" width="1090" height="30" rx="12" fill="#f3f7fb" stroke="#b8c8d8"/><text x="975" y="1186" text-anchor="middle" class="sm">主线：drafter 能力 · 训练目标 · 块内依赖 · 树结构 · 跨轮次轨迹复用 · 验证成本 · 多模态扩展</text>
</svg>